{% extends 'index1.html' %}
{% block maincontent %}

<!-- Header -->
<header class="header">
    <h1>Player Search</h1>
    <p>Find players within your budget, filtered by position and team</p>
</header>

<!-- Filter Bar -->
<div class="search-filter-bar">
    <div class="filter-group">
        <label for="budget-input">Max Budget (£)</label>
        <input type="number" id="budget-input" class="filter-input" value="15" min="3.5" max="15" step="0.5" />
    </div>
    <div class="filter-group">
        <label for="position-select">Position</label>
        <select id="position-select" class="filter-input">
            <option value="all">All</option>
            <option value="GK">GK</option>
            <option value="DEF">DEF</option>
            <option value="MID">MID</option>
            <option value="FOW">FOW</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="team-select">Team</label>
        <select id="team-select" class="filter-input">
            <option value="all">All</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="sort-select">Sort By</label>
        <select id="sort-select" class="filter-input">
            <option value="form_ict_index">Form × ICT</option>
            <option value="points_per_game">PPG</option>
            <option value="ict_index">ICT Index</option>
        </select>
    </div>
</div>

<!-- Results Count -->
<p class="search-results-count" id="results-count">Loading players...</p>

<!-- Results Grid -->
<div class="search-results-grid" id="results-grid"></div>

<script>
    let allPlayers = [];

    const positionColors = {
        GK: '#f59e0b',
        DEF: '#3b82f6',
        MID: '#22c55e',
        FOW: '#ef4444'
    };

    async function fetchPlayers() {
        try {
            const response = await fetch('/api/players/search');
            allPlayers = await response.json();
            populateTeamDropdown();
            applyFilters();
        } catch (error) {
            document.getElementById('results-count').textContent = 'Failed to load players.';
            console.error('Error fetching players:', error);
        }
    }

    function populateTeamDropdown() {
        const teams = [...new Set(allPlayers.map(p => p.team))].sort();
        const select = document.getElementById('team-select');
        teams.forEach(team => {
            const opt = document.createElement('option');
            opt.value = team;
            opt.textContent = team;
            select.appendChild(opt);
        });
    }

    function applyFilters() {
        const budget = parseFloat(document.getElementById('budget-input').value) || 15;
        const position = document.getElementById('position-select').value;
        const team = document.getElementById('team-select').value;
        const sortBy = document.getElementById('sort-select').value;

        let filtered = allPlayers.filter(p => {
            if (p.cost > budget) return false;
            if (position !== 'all' && p.position !== position) return false;
            if (team !== 'all' && p.team !== team) return false;
            return true;
        });

        filtered.sort((a, b) => b[sortBy] - a[sortBy]);
        renderResults(filtered);
    }

    function statusIcon(status) {
        if (status === 'a') return '';
        if (status === 'd') return ' <span class="search-status-doubt" title="Doubtful">?</span>';
        return ' <span class="search-status-out" title="Unavailable">✕</span>';
    }

    function renderResults(players) {
        document.getElementById('results-count').textContent =
            `${players.length} player${players.length !== 1 ? 's' : ''} found`;

        document.getElementById('results-grid').innerHTML = players.map(p => {
            const badgeColor = positionColors[p.position] || '#6b7280';
            const imgSrc = `https://resources.premierleague.com/premierleague25/photos/players/110x140/${p.photo}`;
            return `
            <div class="search-player-card">
                <div class="search-card-img-wrap">
                    <img class="search-player-photo"
                         src="${imgSrc}"
                         alt="${p.webname}"
                         onerror="this.onerror=null;this.src='/static/images/default.png'">
                    <span class="search-position-badge" style="background:${badgeColor}">${p.position}</span>
                </div>
                <div class="search-card-body">
                    <p class="search-player-name">${p.webname}${statusIcon(p.status)}</p>
                    <p class="search-player-team">${p.team}</p>
                    <div class="search-stat-pills">
                        <span class="search-pill search-pill-blue">£${p.cost.toFixed(1)}</span>
                        <span class="search-pill search-pill-green">PPG ${p.points_per_game.toFixed(1)}</span>
                        <span class="search-pill search-pill-amber">ICT ${p.ict_index.toFixed(1)}</span>
                    </div>
                    <div class="search-attack-stats">
                        <div class="search-mini-stat"><span class="search-mini-label">G</span><span>${p.goals_scored}</span></div>
                        <div class="search-mini-stat"><span class="search-mini-label">A</span><span>${p.assists}</span></div>
                        <div class="search-mini-stat"><span class="search-mini-label">xG</span><span>${p.expected_goals.toFixed(2)}</span></div>
                        <div class="search-mini-stat"><span class="search-mini-label">xA</span><span>${p.expected_assists.toFixed(2)}</span></div>
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    document.getElementById('budget-input').addEventListener('input', applyFilters);
    document.getElementById('position-select').addEventListener('change', applyFilters);
    document.getElementById('team-select').addEventListener('change', applyFilters);
    document.getElementById('sort-select').addEventListener('change', applyFilters);

    document.addEventListener('DOMContentLoaded', fetchPlayers);
</script>
{% endblock %}
